services:
  mysql:
    image: mysql:8.4
    container_name: hexagonal-mysql
    environment:
      # compose reads .env automatically; defaults keep it working without one
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE:-hexagonal}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME:-app}", "-p${DB_PASSWORD:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: